[package]
name = "palmar-velle-gesture-controls"
version = "0.1.0"
edition = "2021"
description = "Webcam hand-gesture mouse control for Linux (Wayland), gestures modeled on visionOS pinch/point interactions (still beta version)"

[[bin]]
name = "palmar-velle"
path = "src/main.rs"

[dependencies]
anyhow = "1"
log = "0.4"
env_logger = "0.11"
clap = { version = "4", features = ["derive"] }
opencv = { version = "0.100.1", features = ["clang-runtime"] }

# Camera capture (uses V4L2 on Linux, no external SDK needed)
nokhwa = { version = "0.10", features = ["input-native"] }

# ONNX Runtime bindings - runs the MediaPipe hand-landmark model
ort = { version = "2.0.0-rc.13", default-features = false, features = ["download-binaries", "tls-rustls", "std"] }

# Tensor / image plumbing between camera frames and the model
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

# Virtual input device (uinput) - works under Wayland because it's kernel-level,
# libinput picks it up like any other input device.
evdev = "0.12"
uinput = "0.1.3"


[profile.release]
opt-level = 3
lto = true
