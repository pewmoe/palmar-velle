[package]
name = "palmar-velle-gesture-controls"
version = "0.2.0"
edition = "2021"
description = "Webcam hand-gesture mouse control for Linux (Wayland), gestures modeled on visionOS pinch/point interactions (still beta version)"
license = "AGPL-3.0-or-later"
repository = "https://github.com/your-org/palmar-velle"

[[bin]]
name = "palmar-velle"
path = "src/main.rs"

[dependencies]
anyhow = "1"
log = "0.4"
env_logger = "0.11"
clap = { version = "4", features = ["derive"] }
opencv = { version = "0.100.1", features = ["clang-runtime"] }

# Camera capture (uses V4L2 on Linux, no external SDK needed)
nokhwa = { version = "0.10", features = ["input-native"] }

# ONNX Runtime bindings - runs the MediaPipe hand-landmark model
ort = { version = "2.0.0-rc.13", default-features = false, features = ["download-binaries", "tls-rustls", "std"] }

# Tensor / image plumbing between camera frames and the model
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

# Virtual input device (uinput) - works under Wayland because it's kernel-level,
# libinput picks it up like any other input device.
# (`evdev` is not used by any file you sent me; delete it if nothing else needs it.)
evdev = "0.12"
uinput = "0.1.3"

# --- new in 0.2.0: custom gestures + preview window -------------------------
serde = { version = "1", features = ["derive"] }
toml = "0.8"
signal-hook = "0.3"
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
# Must resolve to the same winit that eframe uses (0.30.x); only needed for
# `with_any_thread`, which lets the GUI event loop run off the main thread.
winit = { version = "0.30", default-features = false, features = ["x11", "wayland"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# ---------------------------------------------------------------------------
# cargo-deb:  cargo install cargo-deb && cargo deb
# Needs assets/hand_landmark.onnx and a LICENSE file in the repo.
# ---------------------------------------------------------------------------
[package.metadata.deb]
name = "palmar-velle"
maintainer = "Your Name <you@example.com>"
copyright = "2026, Your Name <you@example.com>"
license-file = ["LICENSE", "0"]
section = "utils"
priority = "optional"
depends = "$auto"
recommends = "libgl1, libwayland-client0, libxkbcommon0, libxkbcommon-x11-0, libnotify-bin"
extended-description = """\
Palmar Velle turns a webcam into a touchless pointer: palm tracking moves the \
cursor, pinches click/drag/scroll, and user-recorded hand poses trigger key \
combinations, mouse actions or shell commands. Uses a virtual uinput device, \
so it works on Wayland (COSMIC, GNOME, KDE) and X11."""
maintainer-scripts = "packaging/debian"
assets = [
    ["target/release/palmar-velle", "usr/bin/", "755"],
    ["assets/hand_landmark.onnx", "usr/share/palmar-velle/", "644"],
    ["assets/palmar-velle.desktop", "usr/share/applications/", "644"],
    ["assets/palmar-velle.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["assets/99-palmar-velle.rules", "usr/lib/udev/rules.d/", "644"],
    ["packaging/palmar-velle-modules.conf", "usr/lib/modules-load.d/palmar-velle.conf", "644"],
]